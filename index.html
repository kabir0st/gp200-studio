<!doctype html>
<html lang="en">
  <head>
    <!-- Everything between the seo markers is REPLACED at build time by
         scripts/prerender.mjs, which injects the head that src/seo/head.ts
         builds for this route. What is written here is the search-visible
         subset of that head for "/" — deliberately no og:*, twitter:* or
         JSON-LD, since no social crawler ever sees a dev server. It exists so
         `npm run dev` and `vite preview` show sane tags. Keep the title and
         description in step with HOME_TITLE / HOME_DESCRIPTION, but edit
         src/seo/routes.ts first: that is the source of truth. -->
    <!--seo:start-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Valeton GP-200 Editor and Loop Station — GP200 Studio</title>
    <meta
      name="description"
      content="Free, open-source browser editor and loop station for the Valeton GP-200. Edit presets, push changes live over USB-MIDI, and stack unlimited loops."
    />
    <meta name="author" content="Kabir Tamari" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#e8e9eb" />
    <meta name="apple-mobile-web-app-title" content="GP200 Studio" />
    <link rel="canonical" href="https://gp200studio.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!--seo:end-->

    <!-- Stage theme, applied before first paint so a dark-mode reload doesn't
         flash the light board. React adopts this value (src/hooks/useTheme.ts);
         it must not re-decide it. The guide's screenshot swap also keys off the
         data-theme this sets (see .shot-light/.shot-dark in src/index.css).

         NOTE: this queries the FIRST meta[name="theme-color"] and rewrites it.
         Do not add media-scoped light/dark theme-color variants alongside it —
         only one tag may exist or this silently patches the wrong one. -->
    <script>
      try {
        var t = localStorage.getItem('gp200:theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#17181a' : '#e8e9eb');
        }
      } catch (e) {
        /* blocked storage: fall through to the light default */
      }
    </script>

    <!-- Landing motion gate, decided before first paint.

         The landing page's scroll animations need their targets to start
         hidden, but gsap is behind a dynamic import (it must be: the page is
         prerendered under Node, see src/components/landing/useLandingMotion.ts)
         and so lands well after the first frame. Anything gsap hid would flash
         visible first. So the hiding is CSS, gated on this attribute, and this
         script decides — here, before anything paints — whether it is set at
         all.

         Never set means never hidden: JavaScript off, or reduced motion, and
         the prerendered page simply reads. The timeout is the third case, a
         bundle that never boots; useLandingMotion clears it on a successful
         start, and drops the attribute itself if the import fails.

         Landing only. Do not copy this into guide.html - those pages ship no
         JavaScript at all, so nothing would ever un-hide them. -->
    <script>
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.dataset.anim = 'on';
          window.__gp200AnimFallback = setTimeout(function () {
            document.documentElement.removeAttribute('data-anim');
          }, 4000);
        }
      } catch (e) {
        /* no matchMedia: leave every section visible */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
